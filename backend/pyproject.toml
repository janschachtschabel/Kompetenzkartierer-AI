[project]
name = "kompetenzkartierer-ai"
version = "0.1.0"
description = "Curricula nach Curriculum-Kern 1.0 erfassen, andocken und vernetzen"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "prometheus-client>=0.20",
    "rdflib>=7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyshacl>=0.26",
]

[tool.uv]
# The app runs from its source tree (image copies app/); no wheel is built.
package = false
# simplify: pinned to the versions the development machine had in its cache when the
# project started without network access; lift when dependencies are updated online.
constraint-dependencies = [
    "psycopg==3.3.5",
    "psycopg-binary==3.3.5",
    "psycopg-pool==3.3.1",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["pg: needs the PostgreSQL test container (KKA_TEST_DATABASE_URL)"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
