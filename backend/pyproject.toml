[project]
name = "kompetenzkartierer-ai"
version = "0.1.0"
description = "Curricula nach Curriculum-Kern 1.0 erfassen, andocken und vernetzen"
requires-python = "==3.13.*"
# Floors are the versions the code was tested with: request_log uses
# fastapi.routing.iter_route_contexts, new in the 0.14x line
dependencies = [
    "fastapi>=0.143",
    "starlette>=1.7",
    "uvicorn>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "psycopg[binary,pool]>=3.3",
    "prometheus-client>=0.26",
    "rdflib>=7.6",
    # the language model, OpenAI-compatible; the same versions the old app runs (pydantic-ai 2.42
    # does not know gpt-6-luna, app/llm/client.py describes it as measured)
    "openai>=3.25",
    "pydantic-ai-slim[openai]>=2.42",
    # the HTTP client app/llm/client.py hands the SDK, and the one starlette's TestClient takes
    # (with plain httpx it warns that support ends)
    "httpx2>=2.13",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "mypy>=2.3",
    "pyshacl>=0.40",
]

[tool.uv]
# The app runs from its source tree (image copies app/); no wheel is built.
package = false
# simplify: pinned to the versions the development machine had in its cache when the
# project started without network access; lift when dependencies are updated online.
constraint-dependencies = [
    "psycopg==3.3.5",
    "psycopg-binary==3.3.5",
    "psycopg-pool==3.3.1",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["pg: needs the PostgreSQL test container (KKA_TEST_DATABASE_URL)"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
# the tests too: a helper they share is typed like the code it serves
files = ["app", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
