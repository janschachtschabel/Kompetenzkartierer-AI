# The web server of the SPA (deploy/web.Dockerfile). It serves the built files; the API's part
# comes from /etc/nginx/kka/api.conf: in the image a 404 for /api and the spec (in Kubernetes the
# ingress routes both to the API itself), in Compose the proxy to the service "api"
# (deploy/nginx-api.conf, mounted over it). The image names no API host: nginx would resolve it
# once, at start, and stop where it is missing.
server {
    # IPv4 only: a node booted without IPv6 refuses a [::] listener. An IPv6-only cluster adds
    # "listen [::]:8080;" here.
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Once, here, and in no location: a location with an add_header of its own drops every one of
    # these silently. Caching below therefore uses expires, which is no add_header.
    # script, style and font from this origin only (fonts are self-hosted); no third party at all
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    include /etc/nginx/kka/api.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite names the assets by their content: they never change under their name
    location /assets/ {
        expires 1y;
    }

    # Every route of the SPA is index.html; it must not be cached, or a new release stays unseen
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
