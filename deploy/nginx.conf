# The web server of the SPA (deploy/web.Dockerfile). It serves the built files and hands /api
# and the OpenAPI spec on to the API service "api" (Compose; in Kubernetes the ingress routes
# /api itself and this pass only serves the files).
server {
    listen 8080;
    listen [::]:8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Once, here, and in no location: a location with an add_header of its own drops every one of
    # these silently. Caching below therefore uses expires, which is no add_header.
    # script, style and font from this origin only (fonts are self-hosted); no third party at all
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # uploads: 50 MB per file (MAX_UPLOAD_MB) and the form around it
        client_max_body_size 60m;
        # a model call can take long; jobs run in the worker, requests here stay short
        proxy_read_timeout 60s;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite names the assets by their content: they never change under their name
    location /assets/ {
        expires 1y;
    }

    # Every route of the SPA is index.html; it must not be cached, or a new release stays unseen
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
