# The API part of the web server in Compose (mounted over the image's nginx-api-off.conf): /api
# and the spec go to the service "api". Docker's DNS is asked at each request: "api" names every
# replica, and a replica made anew has a new address, which nginx would otherwise keep from its
# start and answer 502 for.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api http://api:8000;

# Here once, for both locations: a location with a proxy_set_header of its own drops these.
# This server is the only edge in Compose: it states the client rather than appending to an
# X-Forwarded-For the client sent, which the API (it trusts this server) would take as the address.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# The API sets these itself, for a cluster; behind this server the server's own go out, once
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;

location /api/ {
    proxy_pass $api;
    # uploads: 50 MB per file (MAX_UPLOAD_MB) and the form around it
    client_max_body_size 60m;
    # a model call can take long; jobs run in the worker, requests here stay short
    proxy_read_timeout 60s;
}

location = /openapi.json {
    proxy_pass $api;
}
