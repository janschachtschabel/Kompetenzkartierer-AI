# The image's API part of the web server (deploy/nginx.conf): none. In Kubernetes the ingress
# routes /api and the spec to the API; a request that reaches this server anyway gets a 404, not
# the SPA's index.html. Compose mounts deploy/nginx-api.conf over this file.
location /api/ { return 404; }
location = /openapi.json { return 404; }
